# =============================================================
#  Build Android APK —— 全自动打包流水线
# -------------------------------------------------------------
#  触发：推送到 main/master 分支，或手动在 Actions 页面运行
#  产物：Trusted Web Activity (TWA) 安卓安装包，自动发布到 Releases
#
#  说明（重要）：
#  1) 原方案中的 pwa-builder/CloudAPK@v1 仓库已于 2025-10 归档、
#     其云端打包服务已停用，故本文件改用 **Bubblewrap**（PWABuilder
#     官方现在维护的 TWA 构建器，效果一致）。
#  2) TWA 方式的 APK 在运行时通过 WebView 加载「应用托管地址」
#     （下方 HOST_URL），并非把网页文件打包进 APK 离线运行。
#     因此：应用必须始终保持托管可访问；本地 IndexedDB 数据保存在
#     该托管域的 WebView 源里，覆盖安装不会清空（源不变）。
#  3) 仓库需开启写权限：Settings → Actions → General →
#     Workflow permissions 勾选「Read and write permissions」。
#  4) Bubblewrap 的 init/build 在 CI 无 TTY 环境下会交互式询问
#     “是否安装 JDK/Android SDK”（已知 issue #806），故用
#     `bubblewrap updateConfig` 预置路径 + `yes n` 喂入 “No，用自带 JDK/SDK”
#     实现非交互；签名密码通过 BUBBLEWRAP_KEY* 环境变量传入。
# =============================================================

name: Build Android APK

on:
  push:
    branches: [ main, master ]   # 提交 main/master 自动触发打包
  workflow_dispatch:             # 支持在仓库 Actions 页面手动运行

# 允许工作流创建 Release（仓库写权限需同步开启，见上方说明 3）
permissions:
  contents: write

env:
  # 应用托管地址（TWA 运行时加载此地址，需与应用实际部署地址一致）
  HOST_URL: "https://443cc7bf3d3944348f9c2bd800aa53f6.bj6.agentos-app.net"
  MANIFEST_URL: "https://443cc7bf3d3944348f9c2bd800aa53f6.bj6.agentos-app.net/manifest.json"
  APP_ID: "com.workdesk.study"          # 包名，全局唯一即可
  APP_NAME: "个人综合工作台"
  # 自签名密钥（仅用于侧载安装，非上架 Google Play）
  KEYSTORE_PWD: "android"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 JDK 17（Bubblewrap/Gradle 构建需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK 并同意许可
        uses: android-actions/setup-android@v3

      - name: 安装 Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: 预置 Bubblewrap 的 JDK / Android SDK 路径（消除交互提示）
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK=$SDK_PATH"
          bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$SDK_PATH"

      - name: 生成签名密钥（自签名，用于给 APK 签名侧载）
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PWD" -keypass "$KEYSTORE_PWD" \
            -dname "CN=Maizi, OU=Workbench, O=Maizi, C=CN"

      - name: 初始化 TWA 工程（从托管 manifest 生成，非交互）
        # `yes n` 回答 “是否安装 JDK/Android SDK” → 选 No 使用已安装的版本
        # 用 PIPESTATUS 取 bubblewrap 真实退出码（避免 yes 因 SIGPIPE 误报失败）
        run: |
          set +e
          yes n | bubblewrap init --manifest "$MANIFEST_URL" --url "$HOST_URL" --appId "$APP_ID" --appName "$APP_NAME" --display standalone
          status=${PIPESTATUS[1]}
          set -e
          exit $status

      - name: 写入签名配置（让 build 非交互）
        run: |
          mkdir -p android
          cat > android/keystore.properties <<EOF
          storeFile=../android.keystore
          storePassword=$KEYSTORE_PWD
          keyPassword=$KEYSTORE_PWD
          keyAlias=android
          EOF

      - name: 构建并签名 APK
        # 跳过 PWA 质量校验（避免无关失败）；签名密码由环境变量传入
        # 用 PIPESTATUS 取 bubblewrap 真实退出码（避免 yes 因 SIGPIPE 误报失败）
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PWD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KEYSTORE_PWD }}
        run: |
          set +e
          yes n | bubblewrap build --skipPwaValidation
          status=${PIPESTATUS[1]}
          set -e
          exit $status

      - name: 上传 APK 到 Release 版本页
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: 安卓APK构建 #${{ github.run_number }}
          files: android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 输出下载提示
        run: echo "APK 打包完成，前往仓库 Releases 页面下载安装包"
