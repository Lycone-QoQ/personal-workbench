# =============================================================
#  Build Android APK —— 全自动打包流水线
# -------------------------------------------------------------
#  触发：推送到 main/master 分支，或手动在 Actions 页面运行
#  产物：Trusted Web Activity (TWA) 安卓安装包，自动发布到 Releases
#
#  说明（重要）：
#  1) 原方案中的 pwa-builder/CloudAPK@v1 仓库已于 2025-10 归档、
#     其云端打包服务已停用，故本文件改用 **Bubblewrap**（PWABuilder
#     官方现在维护的 TWA 构建器，效果一致）。
#  2) TWA 方式的 APK 在运行时通过 WebView 加载「应用托管地址」
#     （下方 HOST_URL），并非把网页文件打包进 APK 离线运行。
#     因此：应用必须始终保持托管可访问；本地 IndexedDB 数据保存在
#     该托管域的 WebView 源里，覆盖安装不会清空（源不变）。
#  3) 仓库需开启写权限：Settings → Actions → General →
#     Workflow permissions 勾选「Read and write permissions」。
# =============================================================

name: Build Android APK

on:
  push:
    branches: [ main, master ]   # 提交 main/master 自动触发打包
  workflow_dispatch:             # 支持在仓库 Actions 页面手动运行

# 允许工作流创建 Release（仓库写权限需同步开启，见上方说明 3）
permissions:
  contents: write

env:
  # 应用托管地址（TWA 运行时加载此地址，需与应用实际部署地址一致）
  HOST_URL: "https://b54fde817d814265850a5de96f78913e.bj2.agentos-app.net"
  MANIFEST_URL: "https://b54fde817d814265850a5de96f78913e.bj2.agentos-app.net/manifest.json"
  APP_ID: "com.workdesk.study"          # 包名，全局唯一即可
  APP_NAME: "个人综合工作台"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 JDK 17（Bubblewrap 构建需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK 并同意许可
        uses: android-actions/setup-android@v3

      - name: 安装 Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: 生成签名密钥（用于给 APK 签名，自签名即可侧载安装）
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Maizi, OU=Workbench, O=Maizi, C=CN"

      - name: 初始化 TWA 工程（从托管 manifest 生成，非交互）
        run: bubblewrap init --manifest "$MANIFEST_URL" --url "$HOST_URL" --appId "$APP_ID" --appName "$APP_NAME" --display standalone

      - name: 写入签名配置（让 build 非交互）
        run: |
          cat > android/keystore.properties <<'EOF'
          storeFile=../android.keystore
          storePassword=android
          keyPassword=android
          keyAlias=android
          EOF

      - name: 构建并签名 APK
        run: bubblewrap build --skipVersionCheck

      - name: 上传 APK 到 Release 版本页
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: 安卓APK构建 #${{ github.run_number }}
          files: android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 输出下载提示
        run: echo "APK 打包完成，前往仓库 Releases 页面下载安装包"
